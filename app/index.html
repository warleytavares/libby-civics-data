<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6fe5">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>Libby Civics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first app. Top stats bar, a scrolling learning path of lesson nodes, bottom tab bar; lessons open as a full-screen runner with a mascot, a progress bar and a feedback sheet. */
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#2a3550; --mute:#7a869c; --line:#e1e8f2; --soft:#f1f5fb;
  --blue:#1f6fe5; --blue-d:#154fae; --green:#31c25b; --green-d:#209443; --green-soft:#dcf7e4;
  --red:#ff4b55; --red-d:#cc2f39; --red-soft:#ffe3e5; --gold:#ffc41f; --gold-d:#d59a00; --navy:#14284b;
  --shadow:0 2px 0 var(--line);
  --f:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a2e; --card:#16233d; --ink:#e9eefb; --mute:#98a8c6; --line:#2a3b5e; --soft:#1a2947;
  --blue:#4a93ff; --blue-d:#2a6fd6; --green:#46d26d; --green-d:#2a9f4d; --green-soft:#12392a;
  --red:#ff6b73; --red-d:#d4434c; --red-soft:#3d1f2a; --gold:#ffd04a; --gold-d:#c9970a; --navy:#e9eefb; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a2e; --card:#16233d; --ink:#e9eefb; --mute:#98a8c6; --line:#2a3b5e; --soft:#1a2947;
  --blue:#4a93ff; --blue-d:#2a6fd6; --green:#46d26d; --green-d:#2a9f4d; --green-soft:#12392a;
  --red:#ff6b73; --red-d:#d4434c; --red-soft:#3d1f2a; --gold:#ffd04a; --gold-d:#c9970a; --navy:#e9eefb; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:600 16px/1.45 var(--f);margin:0;padding:0;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:12px}
h1,h2,h3,p{margin:0}
svg{display:block}
[hidden]{display:none!important}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}

/* chunky 3D buttons */
.btn{display:block;width:100%;border-radius:16px;padding:14px 18px;font-weight:900;font-size:16px;letter-spacing:.04em;text-transform:uppercase;text-align:center;background:var(--green);color:#fff;border-bottom:5px solid var(--green-d);transition:transform .08s,border-width .08s,margin .08s}
.btn:active{transform:translateY(4px);border-bottom-width:1px;margin-bottom:4px}
.btn.blue{background:var(--blue);border-bottom-color:var(--blue-d)}
.btn.red{background:var(--red);border-bottom-color:var(--red-d)}
.btn.ghost{background:var(--card);color:var(--blue);border:2px solid var(--line);border-bottom-width:5px}
.btn.ghost:active{border-bottom-width:2px}
.btn[disabled]{background:var(--line);color:var(--mute);border-bottom-color:var(--line);cursor:default}
:root[data-theme="dark"] .btn:not(.ghost):not([disabled]){color:#08111f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost):not([disabled]){color:#08111f}}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:2px solid var(--line)}
.stat{display:flex;align-items:center;gap:6px;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.stat svg{width:26px;height:26px}
.brand{font-weight:900;font-size:19px;color:var(--blue);letter-spacing:-.01em}
#view{flex:1;padding:18px 16px 110px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:2px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav>div{display:flex;width:100%;max-width:520px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 8px;color:var(--mute);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.nav button svg{width:30px;height:30px}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] .ic{background:var(--soft);border:2px solid var(--blue);border-radius:12px}
.nav .ic{padding:3px 8px;border:2px solid transparent;border-radius:12px;display:grid;place-items:center}

/* mascot */
.mascot{width:100%;height:100%;overflow:visible}
.mascot .e-happy,.mascot .e-sad,.mascot .tear{display:none}
.mascot.happy .e-normal,.mascot.sad .e-normal{display:none}
.mascot.happy .e-happy{display:block}
.mascot.sad .e-sad,.mascot.sad .tear{display:block}
.mascot .pupil{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.hop{animation:hop .6s ease}
@keyframes hop{30%{transform:translateY(-18px) scale(1.04)}60%{transform:translateY(0) scale(.98,1.03)}}
.wiggle{animation:wiggle .5s ease}
@keyframes wiggle{20%{transform:rotate(-8deg)}50%{transform:rotate(7deg)}80%{transform:rotate(-3deg)}}

/* learning path */
.hero{display:flex;gap:12px;align-items:center;background:var(--soft);border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:18px}
.hero .m{width:76px;height:76px;flex:none}
.hero h2{font-size:20px;font-weight:900;line-height:1.2}
.hero p{color:var(--mute);font-size:14px;margin-top:2px}
.meter{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .6s cubic-bezier(.2,.9,.3,1.2)}
.unit{border-radius:18px;padding:14px 16px;color:#fff;margin:22px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:5px solid rgba(0,0,0,.18)}
.unit h3{font-size:18px;font-weight:900;line-height:1.2}
.unit small{display:block;opacity:.9;font-size:13px;font-weight:700}
.unit .tag{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.path{display:flex;flex-direction:column;align-items:center;gap:40px;padding:16px 0 34px}
.node{position:relative;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;color:#fff;border-bottom:7px solid rgba(0,0,0,.22);transition:transform .1s}
.node:active{transform:translateY(5px);border-bottom-width:2px}
.node svg{width:36px;height:36px}
.node .ring{position:absolute;inset:-9px;width:calc(100% + 18px);height:calc(100% + 18px);transform:rotate(-90deg);pointer-events:none}
.node.next{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.node .lbl{position:absolute;top:100%;margin-top:10px;white-space:nowrap;font-size:13px;font-weight:800;color:var(--mute)}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.mock{display:flex;gap:14px;align-items:center;background:var(--navy);color:#fff;border-radius:20px;padding:16px;border-bottom:6px solid rgba(0,0,0,.3);text-align:left;width:100%}
:root[data-theme="dark"] .mock{background:#223a68;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mock{background:#223a68;color:#fff}}
.mock .m{width:56px;height:56px;flex:none}
.mock b{display:block;font-size:19px;font-weight:900}
.mock span{font-size:14px;opacity:.85}

/* generic cards */
.card{border:2px solid var(--line);border-radius:18px;padding:16px;background:var(--card)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:2px solid var(--line);border-radius:16px;padding:12px;background:var(--card)}
.tile b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.sec{font-size:22px;font-weight:900;margin:6px 0 12px}
label.l{display:block;font-size:12px;font-weight:900;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px}
input[type=text],input[type=search],select,textarea{width:100%;font:inherit;font-weight:700;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:50px}
textarea{min-height:84px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:800;background:var(--card);color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.gold{border-color:var(--gold-d);color:var(--gold-d)}
.row{display:flex;gap:10px}
.list{display:grid;gap:10px;margin-top:10px}
.list details{border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card)}
.list summary{font-weight:800;cursor:pointer;display:flex;gap:10px}
.list summary .n{color:var(--mute);min-width:30px;font-variant-numeric:tabular-nums}
.list ul{margin:10px 0 0 38px;padding-left:18px;font-weight:600}
.hist{display:grid;gap:8px}
.hist div{display:flex;justify-content:space-between;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:800}
.ok{color:var(--green-d)} .no{color:var(--red-d)}
.switch{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:2px solid var(--line);font-weight:800}
.tog{width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.tog[aria-pressed="true"]{background:var(--green)}
.tog[aria-pressed="true"]::after{transform:translateX(22px)}

/* runner */
.run{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
.run-top{display:flex;align-items:center;gap:12px;padding:14px 16px}
.x{width:34px;height:34px;color:var(--mute);flex:none}
.bar{flex:1;height:18px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .5s cubic-bezier(.2,.9,.3,1.1);position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:5px;border-radius:9px;background:rgba(255,255,255,.35)}
.lives{display:flex;align-items:center;gap:5px;font-weight:900;color:var(--red);font-size:18px;flex:none;font-variant-numeric:tabular-nums}
.lives svg{width:26px;height:26px}
.lives.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
.run-body{flex:1;overflow-y:auto;padding:6px 18px 24px;display:flex;flex-direction:column;gap:14px}
.rchips{display:flex;gap:8px;flex-wrap:wrap}
.asking{display:flex;gap:10px;align-items:flex-start}
.asking .m{width:92px;height:92px;flex:none;margin-top:6px}
.bubble{position:relative;flex:1;min-width:0;border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-size:19px;font-weight:800;line-height:1.3;background:var(--card);overflow-wrap:anywhere}
.bubble::before{content:"";position:absolute;left:-10px;top:26px;width:16px;height:16px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.say{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:900;font-size:14px;margin-top:8px}
.say svg{width:22px;height:22px}
.answer{border:2px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--soft);animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
.answer h3{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin-bottom:8px}
.answer ul{margin:0;padding-left:20px;display:grid;gap:5px;font-weight:700;font-size:17px}
.mine{margin-top:12px;border:2px dashed var(--blue);border-radius:14px;padding:10px 12px;font-size:15px}
.mine h3{color:var(--blue)}
.mine a,.note a{color:inherit;font-weight:900}
.note{margin-top:12px;font-size:14px;color:var(--mute)}
.foot{padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);display:grid;gap:10px}
.foot .row>*{flex:1}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:slide .35s cubic-bezier(.2,.9,.3,1.1) both}
.sheet.good{background:var(--green-soft);color:var(--green-d)}
.sheet.bad{background:var(--red-soft);color:var(--red-d)}
.sheet h3{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900}
.sheet h3 svg{width:34px;height:34px}
.sheet p{font-weight:700;font-size:15px}
@keyframes slide{from{transform:translateY(110%)}to{transform:none}}
.xp-float{position:absolute;right:22px;bottom:150px;font-weight:900;font-size:26px;color:var(--gold-d);animation:floatup 1s ease-out forwards;pointer-events:none}
@keyframes floatup{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-80px) scale(1.3)}}

.choices{display:grid;gap:10px}
.optrow{display:flex;gap:8px;align-items:stretch}
.opt{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px 14px;background:var(--card);font-weight:800;font-size:17px;line-height:1.3;transition:transform .08s}
.opt:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.opt .k{width:30px;height:30px;border:2px solid var(--line);border-radius:9px;display:grid;place-items:center;font-size:14px;color:var(--mute);flex:none}
.opt .t{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green-d);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.opt.right .k{border-color:var(--green);color:var(--green-d)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red-d);animation:shake .4s}
.opt.wrong .k{border-color:var(--red);color:var(--red-d)}
.opt.dim{opacity:.55}
.spk{width:50px;flex:none;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;color:var(--blue);display:grid;place-items:center;background:var(--card)}
.spk svg{width:24px;height:24px}
.spk:active{transform:translateY(3px);border-bottom-width:2px}
.voice{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0}
.mic{width:104px;height:104px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;border-bottom:7px solid var(--red-d)}
.mic svg{width:48px;height:48px}
.mic.on{animation:micpulse 1.1s infinite;border-bottom-width:3px}
@keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(255,75,85,.55)}100%{box-shadow:0 0 0 30px rgba(255,75,85,0)}}
.heard{min-height:60px;width:100%;border:2px dashed var(--line);border-radius:14px;padding:12px;text-align:center;font-weight:800;font-size:18px;overflow-wrap:anywhere}
.voice .row{width:100%}
.voice .row>*{flex:1}
.seg{display:flex;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{flex:1;padding:10px;font-weight:800;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.steps{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;font-weight:700}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px}
.steps b{font-weight:900}
.rev{display:grid;gap:8px;list-style:none;margin:0;padding:0;width:100%}
.rev li{border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.rev li.bad{border-color:var(--red)} .rev li.good{border-color:var(--green)}
.rev .said{color:var(--mute);font-size:14px;font-weight:700;margin-top:4px}
.rev .acc{font-size:13px;margin-top:4px;font-weight:700}
.rev button{margin-top:8px;color:var(--blue);font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
/* result + onboarding */
.full{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;max-width:520px;margin:0 auto;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));gap:14px}
.full .big{width:170px;height:170px;flex:none}
.full h1{font-size:30px;font-weight:900;text-align:center;line-height:1.1}
.full .sub{color:var(--mute);text-align:center;font-weight:700;max-width:34ch}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tiles .tile{text-align:center;border-width:2px}
.tiles .tile.g{border-color:var(--gold-d)} .tiles .tile.g b{color:var(--gold-d)}
.tiles .tile.b{border-color:var(--blue)} .tiles .tile.b b{color:var(--blue)}
.tiles .tile.r{border-color:var(--green)} .tiles .tile.r b{color:var(--green-d)}
.missed{width:100%;display:grid;gap:8px;list-style:none;margin:0;padding:0}
.missed li{border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:800}
.missed ul{margin:4px 0 0;padding-left:18px;color:var(--mute);font-weight:600;font-size:14px}
.spacer{flex:1}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
footer.fine{margin-top:26px;font-size:12px;color:var(--mute);display:grid;gap:6px;font-weight:600}
footer.fine a{color:inherit}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<div id="app">
  <header class="top">
    <span class="brand">Libby Civics</span>
    <span style="display:flex;gap:14px;align-items:center">
      <span class="stat" title="Day streak"><svg viewBox="0 0 24 24"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2 1-3.2 2-4.2.3 1.4 1 2.2 1.8 2.6C10.2 8.6 10.6 5 12 2z" fill="#ff9c1a"/><path d="M12 13c1.6 1.4 2.6 2.3 2.6 3.6a2.6 2.6 0 0 1-5.2 0c0-1.3 1-2.2 2.6-3.6z" fill="#ffd44d"/></svg><span id="tStreak">0</span></span>
      <span class="stat" title="Experience points"><svg viewBox="0 0 24 24"><path d="M13.5 2 5 13.5h6L10 22l9-12h-6z" fill="#ffc41f" stroke="#d59a00" stroke-width="1.2" stroke-linejoin="round"/></svg><span id="tXp">0</span></span>
    </span>
  </header>
  <main id="view"></main>
  <nav class="nav" aria-label="Main"><div id="navBtns"></div></nav>
</div>

<!-- LESSON / TEST RUNNER -->
<section class="run" id="run" hidden aria-live="polite">
  <div class="run-top">
    <button class="x" id="xBtn" type="button" aria-label="Quit"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></button>
    <div class="bar" id="barWrap"><i id="barFill"></i></div><div id="qcount" hidden style="flex:1;font-weight:900;color:var(--mute);font-size:17px"></div>
    <div class="lives" id="lives"></div>
  </div>
  <div class="run-body" id="runBody">
    <div class="rchips" id="rChips"></div>
    <div class="asking">
      <div class="m bob" id="runMascotBox"></div>

const dayStr = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
function touchStreak(){
  const now = new Date(), t = dayStr(now); if (S.last === t) return;
  const y = new Date(now); y.setDate(y.getDate()-1);
  S.days = S.last === dayStr(y) ? S.days + 1 : 1; S.last = t;
}
function liveStreak(){ if (!S.last) return 0; const now = new Date(), y = new Date(now); y.setDate(y.getDate()-1); return (S.last === dayStr(now) || S.last === dayStr(y)) ? S.days : 0; }
const level = () => Math.floor(S.xp / 100) + 1;

/* ---------- sound ---------- */
let AC = null;
function tone(f, d, type, delay, g){ if (!S.sound) return; try { AC = AC || new (window.AudioContext||window.webkitAudioContext)(); const o = AC.createOscillator(), a = AC.createGain(); o.type = type||"sine"; o.frequency.value = f; const t = AC.currentTime + (delay||0); a.gain.setValueAtTime(0.0001,t); a.gain.exponentialRampToValueAtTime(g||.18,t+.02); a.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(a); a.connect(AC.destination); o.start(t); o.stop(t+d+.05); } catch(e){} }
const sfx = {
  good(){ tone(660,.14,"triangle",0); tone(880,.22,"triangle",.1); },
  bad(){ tone(220,.25,"sawtooth",0,.12); tone(165,.3,"sawtooth",.12,.1); },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f,.28,"triangle",i*.12)); },
  tap(){ tone(520,.05,"square",0,.05); }
};
function speak(t){ try { if (!window.speechSynthesis) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = .95; speechSynthesis.speak(u); } catch(e){} }

/* ---------- confetti ---------- */
function confetti(){
  const c = $("confetti"); c.hidden = false; const x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#ff4b55","#1f6fe5","#ffc41f","#31c25b","#ffffff","#ff9c1a"];
  const P = Array.from({length:150}, () => ({x:Math.random()*c.width, y:-20-Math.random()*c.height*.5, vx:(Math.random()-.5)*5, vy:2+Math.random()*5, s:6+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:cols[Math.floor(Math.random()*cols.length)]}));
  let f = 0;
  (function loop(){ x.clearRect(0,0,c.width,c.height); P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .06; p.r += p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6); x.restore(); }); if (++f < 200) requestAnimationFrame(loop); else { x.clearRect(0,0,c.width,c.height); c.hidden = true; } })();
}

const TERRITORIES = {"Puerto Rico":"San Juan","Guam":"Hagåtña","U.S. Virgin Islands":"Charlotte Amalie","American Samoa":"Pago Pago","Northern Mariana Islands":"Saipan"};

function localHelp(q){
  if (FED[q.n]){ const nm = OFF.federal[FED[q.n][0]]; return nm ? "<h3>Current answer</h3><p><b>" + esc(nm) + "</b></p>" + offFoot() : ""; }
  if (![23,29,61,62].includes(q.n)) return "";
  const st = S.state, k = kind();
  if (!st) return "<h3>Where you live</h3><p>Set your state in the Me tab to see help for this question.</p>";
  const a = u => "<a href='" + LK[u][0] + "' target='_blank' rel='noopener'>" + LK[u][1] + "</a>";
  let h = "<h3>For " + esc(st) + "</h3>";
  if (q.n === 62) h += k === "state" ? "<p>The capital of " + esc(st) + " is <b>" + esc(CAPITALS[st]) + "</b>.</p>" : k === "terr" ? "<p>Name the capital of your territory: <b>" + esc(TERRITORIES[st]) + "</b>.</p>" : "<p>Answer that D.C. is not a state and does not have a capital.</p>";
  else if (q.n === 61){
    const g = k === "state" && OFF.states[st] && OFF.states[st].governor;
    h += k === "dc" ? "<p>Answer that D.C. does not have a governor.</p>" : g ? "<p>The governor of " + esc(st) + " is <b>" + esc(g) + "</b>.</p>" + offFoot() : "<p>Look up the current governor" + (k === "terr" ? " of your territory" : " of " + esc(st)) + " at " + a("gov") + ". It can change after an election.</p>";
  } else if (q.n === 23){
    const sn = k === "state" && OFF.states[st] ? OFF.states[st].senators : [];
    h += k === "state" ? (sn.length ? "<p>The U.S. senators of " + esc(st) + " are <b>" + sn.map(esc).join("</b> and <b>") + "</b>. Give one name.</p>" + offFoot() : "<p>Look up the current U.S. senators of " + esc(st) + " at " + a("con") + " and give one name.</p>") : "<p>Answer that " + (k === "dc" ? "D.C." : "your territory (" + esc(st) + ")") + " has no U.S. senators.</p>";
  } else {
    if (k === "state"){
      const reps = (OFF.states[st] && OFF.states[st].representatives) || [];
      h += "<p>Your representative depends on your district (your home address). Find yours at " + a("con") + ".</p>";
      if (reps.length) h += "<details style='margin-top:8px'><summary style='cursor:pointer;font-weight:900'>See all " + reps.length + " representative" + (reps.length>1?"s":"") + " of " + esc(st) + "</summary><ul style='margin:6px 0 0;padding-left:18px'>" + reps.map(r => "<li>" + (r.district ? "District " + r.district : "At large") + ": " + esc(r.name) + "</li>").join("") + "</ul></details>" + offFoot();

/* ---------- matching spoken answers against the accepted answers ---------- */
const NW = {zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
const STOP = new Set(["the","a","an","of","to","and","is","are","in","on","for","that","it","its","as","by","at","with","be"]);
function toks(str){
  const w = String(str).toLowerCase().replace(/\[[^\]]*\]/g, " ").replace(/\([^)]*\)/g, " ").replace(/[’']/g, "").replace(/-/g, " ").replace(/[^a-z0-9 ]+/g, " ").split(/\s+/).filter(Boolean);
  const out = [];
  for (let i = 0; i < w.length; i++){
    let x = w[i];
    if (x in NW){
      let n = NW[x];
      if (n >= 20 && w[i+1] in NW && NW[w[i+1]] > 0 && NW[w[i+1]] < 10){ n += NW[w[++i]]; }
      if (w[i+1] === "hundred"){ n = (n || 1) * 100; i++; if (w[i+1] in NW && NW[w[i+1]] < 100 && NW[w[i+1]] > 0){ n += NW[w[++i]]; } }
      out.push(String(n)); continue;
    }
    if (x === "hundred"){ out.push("100"); continue; }
    if (x.length > 3 && x.endsWith("s") && !x.endsWith("ss")) x = x.slice(0, -1);
    out.push(x);
  }
  return out;
}
function near(a, b){
  if (a === b) return true;
  if (Math.min(a.length, b.length) < 5 || Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, e = 0;
  while (i < a.length && j < b.length){
    if (a[i] === b[j]){ i++; j++; continue; }
    if (++e > 1) return false;
    if (a.length > b.length) i++; else if (a.length < b.length) j++; else { i++; j++; }
  }
  return e + (a.length - i) + (b.length - j) <= 1;
}
/* does `said` (array of tokens, consumed when matched) contain this accepted answer? returns the tokens it used or null */
function takeAnswer(ans, avail){
  const A = toks(ans).filter(t => !STOP.has(t)); if (!A.length) return null;
  const used = [];
  for (const t of A){ const k = avail.findIndex((x, ix) => !used.includes(ix) && near(x, t)); if (k >= 0) used.push(k); }
  const need = A.length <= 2 ? A.length : Math.ceil(A.length * 0.75);
  return used.length >= need ? used : null;
}
function lastName(n){ const w = String(n).replace(/\b(Jr|Sr|II|III|IV)\b\.?/g, "").replace(/[.,]/g, " ").trim().split(/\s+/); return w[w.length - 1].toLowerCase().replace(/[’']/g, ""); }
function saidHasName(name, said){ const L = lastName(name); return toks(said).some(t => near(t, L) || near(t, L.replace(/s$/, ""))); }
/* answers that depend on who holds an office or where you live: returns {names:[...]} | {phrase:[...]} | "manual" | null */
function dynSpec(q){
  if (FED[q.n]) return {names: [OFF.federal[FED[q.n][0]]].filter(Boolean)};
  if (![23,29,61,62].includes(q.n)) return null;
  const k = kind(), st = S.state; if (!st) return "manual";
  if (q.n === 62) return k === "dc" ? "manual" : {phrase: [k === "terr" ? TERRITORIES[st] : CAPITALS[st]]};
  if (q.n === 61) return k === "state" && OFF.states[st] && OFF.states[st].governor ? {names: [OFF.states[st].governor]} : "manual";
  if (q.n === 23) return k === "state" && OFF.states[st] ? {names: OFF.states[st].senators} : "manual";
  if (k === "state") return OFF.states[st] ? {names: OFF.states[st].representatives.map(r => r.name)} : "manual";
  return OFF.others && OFF.others[st] && OFF.others[st].delegate ? {names: [OFF.others[st].delegate]} : "manual";
}
function gradeSpoken(q, said){
  if (!String(said).trim()) return {ok: false};
  const d = dynSpec(q);
  if (d === "manual") return {ok: true, manual: true};
  if (d && d.names) return {ok: d.names.some(n => saidHasName(n, said))};
  if (d && d.phrase) return {ok: d.phrase.some(a => takeAnswer(a, toks(said)))};
  const avail = toks(said), need = Math.max(1, q.need || 1);
  let hits = 0;
  q.a.slice().sort((x, y) => toks(y).length - toks(x).length).forEach(a => {
    const u = takeAnswer(a, avail);
    if (u){ hits++; u.sort((m, n) => n - m).forEach(ix => avail.splice(ix, 1)); }
  });
  return {ok: hits >= need};
}

/* ---------- multiple choice: wrong options are real answers taken from other questions ---------- */

document.addEventListener("keydown", e => {

  if (R.phase === "ask" && R.style === "open" && (e.key === " " || e.key === "Enter")){ e.preventDefault(); reveal(); }
  else if (R.phase === "reveal" && (e.key === "y" || e.key === "Y")) grade(true);
  else if (R.phase === "reveal" && (e.key === "n" || e.key === "N")) grade(false);
  else if (R.phase === "ask" && R.style === "mc" && /^[1-4]$/.test(e.key) && R.mc.opts[+e.key - 1]) pick(+e.key - 1);
  else if (R.phase === "sheet" && R.kind !== "test" && e.key === "Enter"){ e.preventDefault(); next(); }
});

/* ---------- onboarding ---------- */
function onboarding(){
  const opts = ["<option value=''>Select where you live</option>"].concat(Object.keys(CAPITALS).map(n => "<option>" + n + "</option>"), ["<option>" + DC + "</option>"], Object.keys(TERRITORIES).map(n => "<option>" + n + "</option>")).join("");
  $("onb").innerHTML = '<div class="big bob" id="onbM">' + MASCOT.replace('class="mascot"','class="mascot happy"') + '</div><h1>Hi, I am Libby!</h1><p class="sub">I will help you get ready for the U.S. citizenship civics test. First, tell me a little about you.</p>' +
   '<div style="width:100%"><label class="l" for="oName" style="margin-top:0">First name (optional)</label><input type="text" id="oName" maxlength="40" autocomplete="given-name" placeholder="Your first name"><label class="l" for="oState">State or territory</label><select id="oState">' + opts + '</select><p style="color:var(--mute);font-size:13px;margin-top:8px">Some answers depend on where you live. Saved only on this device.</p></div><div class="spacer"></div><button class="btn" id="oGo" type="button">Let us start</button>';
  $("onb").hidden = false;
  $("oGo").onclick = () => { S.name = $("oName").value.trim(); S.state = $("oState").value; S.onboarded = true; save(); sfx.good(); $("onb").hidden = true; render(); };
}

nav(); render(); if (!S.onboarded) onboarding();
refreshOfficials();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refreshOfficials(); });
setInterval(refreshOfficials, 3600e3);
</script>
