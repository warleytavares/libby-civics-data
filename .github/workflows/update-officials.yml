name: Update officials
on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 09:17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build officials.json (fails without overwriting if the data looks broken)
        run: python update_officials.py officials.json
      - name: Commit if changed
        run: |
          git config user.name "libby-bot"
          git config user.email "libby-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain officials.json)" ]; then
            git add officials.json
            git commit -m "Update officials $(date -u +%F)"
            git push
          fi
